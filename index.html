<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#15172f">
    <meta name="description" content="Privacy and support information for Go to Sheep, a quiet bedtime ritual for iPhone and iPad.">
    <title>Go to Sheep</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="page home">
      <div class="sky" aria-hidden="true">
        <div class="moon"></div>
        <span class="star star-one"></span>
        <span class="star star-two"></span>
        <span class="star star-three"></span>
      </div>

      <section class="card hero">
        <p class="eyebrow">A little less awake</p>
        <h1>Go to Sheep</h1>
        <div class="rule"></div>
        <p class="lede">A quiet, absurdist bedtime ritual. No accounts, no ads, no tracking—just sheep crossing a moonlit meadow.</p>
        <nav class="actions" aria-label="Go to Sheep information">
          <a class="button" href="./privacy/">Privacy policy</a>
          <a class="button secondary" href="./support/">Support</a>
        </nav>
      </section>
    </main>
    <footer>Go to Sheep · Everything the app needs stays on your device.</footer>
  </body>
</html>
